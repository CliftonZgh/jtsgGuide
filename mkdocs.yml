site_name: 交通事故处理指南
site_description: 面向普通驾驶人与乘客的交通事故处置、责任认定与保险理赔实用手册
site_author: jtsgGuide
site_url: https://cliftonzgh.github.io/jtsgGuide/
copyright: Copyright &copy; 2026 jtsgGuide

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: amber

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences

extra:
  generator: true

nav:
  - 首页: index.md
  - 事前预防:
      - 总览: 事前预防.md
      - 车主与驾驶人: 事前预防-车主与驾驶人.md
      - 乘客与同行者: 事前预防-乘客与同行者.md
      - 行人与非机动车: 事前预防-行人与非机动车.md
  - 现场处理:
      - 总览: 现场处理.md
      - 车主与驾驶人: 现场处理-车主与驾驶人.md
      - 乘客与同行者: 现场处理-乘客与同行者.md
      - 行人与非机动车: 现场处理-行人与非机动车.md
  - 跟踪处置:
      - 总览: 跟踪处置.md
      - 按角色:
          - 车主与驾驶人: 跟踪处置-车主与驾驶人.md
          - 伤者与家属: 跟踪处置-伤者与家属.md
      - 按事项:
          - 报警与报险: 跟踪处置-报警与报险.md
          - 责任认定: 跟踪处置-责任认定.md
          - 保险理赔: 跟踪处置-保险理赔.md
          - 法律风险提示: 跟踪处置-法律风险提示.md
  - 经验汇编:
      - 总览: 经验汇编.md
      - 快速问答:
          - 按角色:
              - 车主与驾驶人: 经验汇编-车主与驾驶人.md
              - 伤者与家属: 经验汇编-伤者与家属.md
          - 按环节: 经验汇编-按环节.md
          - 问题汇总: 经验汇编-通用问题.md
      - 案例复盘:
          - 案例展示: 经验汇编-案例展示.md
      - 专题文章:
          - 如何看懂事故认定书: 专题文章-如何看懂事故认定书.md
          - 事故处理相关角色: 专题文章-事故处理相关角色.md
  - 实用工具:
      - 总览: 实用工具.md
      - 常用网站及电话: 实用工具-常用网站及电话.md
      - 交通事故赔偿标准:
          - 年度地区索引: 赔偿标准/年度地区索引.md
          - 2025 年:
              - 城市索引: 赔偿标准/2025/城市索引.md
          - 2026 年:
              - 城市索引: 赔偿标准/2026/城市索引.md
              - 广东省:
                  - 省级标准: 赔偿标准/2026/广东省/省级标准.md
                  - 广州市: 赔偿标准/2026/广东省/广州市.md
          - 2027 年:
              - 城市索引: 赔偿标准/2027/城市索引.md
      - 伤残评估介绍:
          - 伤情比照: 实用工具-伤残评估.md
          - 赔偿计算: 实用工具-赔偿计算器.md
  - 关于本站: 关于本站.md

extra_css:
  - stylesheets/extra.css
